{{ define "hero" }}
<header class="hero"><div class="wrap">
<h1>{{ .Title }}</h1>
{{ partial "hero-buttons.html" . }}
</div></header>
{{ end }}
{{ define "main" }}
<ul class="terms">
{{ range .Data.Terms.Alphabetical }}<li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span class="meta">({{ .Count }})</span></li>
{{ end }}</ul>
{{ end }}
